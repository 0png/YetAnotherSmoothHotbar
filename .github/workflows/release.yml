name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release source and version
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in main."
            exit 1
          fi

          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" || "$version" == *-SNAPSHOT ]]; then
            echo "mod_version must be a non-SNAPSHOT version for release."
            exit 1
          fi
          if [[ "$tag_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version."
            exit 1
          fi
      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          validate-wrappers: true
          cache-read-only: true
      - name: Build release JAR
        run: ./gradlew clean build --no-daemon --stacktrace
      - name: Locate package and create checksum
        id: package
        shell: bash
        run: |
          jar_path="$(find versions/26_2/fabric/build/libs -maxdepth 1 -type f -name 'yash-*.jar' ! -name '*-sources.jar' -print -quit)"
          if [[ -z "$jar_path" ]]; then
            echo "Release JAR was not produced."
            exit 1
          fi
          sha256sum "$jar_path" > "$jar_path.sha256"
          echo "jar=$jar_path" >> "$GITHUB_OUTPUT"
          echo "checksum=$jar_path.sha256" >> "$GITHUB_OUTPUT"
      - name: Upload verified release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            ${{ steps.package.outputs.jar }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          JAR_PATH: ${{ steps.package.outputs.jar }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$JAR_PATH" \
            "$CHECKSUM_PATH" \
            --verify-tag \
            --generate-notes \
            --title "YASH ${GITHUB_REF_NAME#v}" \
            "${release_flags[@]}"
